model: "./models/Qwen3-8B-MLX-8bit"
data: "./data"
adapter_path: "./adapters"
fine_tune_type: "lora"
num_layers: -1
lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.05
optimizer: "adamw"
learning_rate: 1.0e-4
lr_schedule:
  name: "cosine_decay"
  warmup: 100
  arguments: [1.0e-4, 2250, 1.0e-5]
batch_size: 2
grad_accumulation_steps: 4
iters: 2250
max_seq_length: 1024
mask_prompt: true
steps_per_report: 10
steps_per_eval: 100
val_batches: 25
save_every: 250
grad_checkpoint: false
seed: 42
